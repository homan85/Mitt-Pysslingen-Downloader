name: Build patched Ice for macOS 27

on:
  push:
    branches:
      - build-ice-macos27

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$LATEST" ]; then
            sudo xcode-select -s "$LATEST"
          fi
          xcodebuild -version

      - name: Clone Ice
        run: |
          git clone --depth 1 https://github.com/cavaldos/Ice.git Ice-src
          cd Ice-src
          git rev-parse HEAD

      - name: Apply macOS 27 multi-spacer fix
        run: |
          python3 .github/scripts/patch_ice.py
          cd Ice-src
          git diff --check
          git diff -- Ice/MenuBar/ControlItem/ControlItem.swift

      - name: Build Ice.app
        working-directory: Ice-src
        run: |
          xcodebuild -project Ice.xcodeproj -scheme Ice -configuration Release \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= \
            clean build

          BUILD_DIR=$(xcodebuild -project Ice.xcodeproj -scheme Ice -configuration Release \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= \
            -showBuildSettings 2>/dev/null \
            | sed -n 's/^ *BUILT_PRODUCTS_DIR *= *//p' | head -1)

          test -d "$BUILD_DIR/Ice.app"
          codesign --force --deep --sign - "$BUILD_DIR/Ice.app"
          ditto -c -k --keepParent "$BUILD_DIR/Ice.app" "$GITHUB_WORKSPACE/Ice-macOS27-patched.zip"

      - name: Upload Ice.app
        uses: actions/upload-artifact@v4
        with:
          name: Ice-macOS27-patched
          path: Ice-macOS27-patched.zip
          if-no-files-found: error
          retention-days: 7
